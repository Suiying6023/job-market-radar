# 杭州 AI/Agent 开发岗位多关键词采集，增量库版本。
# 关键词按覆盖面重构：保留原有 6 个高产词 + AI算法工程师（跑题率 6%，可接受）。
# 曾试过 RAG工程师/Prompt工程师/MCP开发，跑题率 20-26%（被平台推荐算法带进
# 量化开发、鸿蒙开发等无关岗位），2026-07-30 实测后砍掉，不再使用。
platforms:
  - boss
cities:
  - name: 杭州
    boss_code: "101210100"
keywords:
  - AI Agent
  - 智能体开发
  - 大模型应用开发
  - AI应用工程师
  - LLM应用开发
  - AI开发工程师
  - AI算法工程师
pages_per_query: 5
detail_limit_per_query: 150
page_size: 30
collect_details: true
request_delay_seconds: [6, 12]
detail_delay_seconds: [3, 7]
max_requests_per_run: 250
filters:
  - {}
exclude_title_keywords:
  - 销售
  - 主播
  - 客服
  - 电话
  - 实习
exclude_company_keywords:
  - 猎头
  - 劳务派遣
database_path: data/hangzhou_agent.sqlite3
raw_dir: data/raw
output_dir: output
browser:
  mode: cdp
  cdp_url: http://127.0.0.1:9222
  headless: false
  navigation_timeout_ms: 30000
auto_chat:
  enabled: false
  dry_run: true
  require_manual_confirm: true
